<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargar fotos — FotoGuessr</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --slate:#10161c; --slate-2:#171f27; --line:rgba(233,233,222,0.10);
    --paper:#e9e9de; --paper-dim:rgba(233,233,222,0.55);
    --signal:#ff6a3d; --teal:#7fd6c2; --grid:#3a5a55;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: var(--slate); color: var(--paper); min-height:100vh;
    font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
  }
  .display{ font-family: Georgia,'Times New Roman',serif; }
  .center-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 24px; }
  .card{ width:100%; max-width: 420px; background: var(--slate-2); border: 1px solid var(--line); padding: 36px 32px; }
  .card .eyebrow{ font-size: 12px; color: var(--grid); }
  .card h1{ font-family: Georgia, serif; font-weight: 400; font-size: 28px; margin: 6px 0 18px; }
  .field{ width:100%; background: var(--slate); border: 1px solid rgba(233,233,222,0.2); color: var(--paper); padding: 13px 14px; font-size: 15px; font-family: inherit; margin-bottom: 12px; }
  .field:focus{ outline:none; border-color: var(--signal); }
  .btn{ display:inline-block; width:100%; background: var(--signal); color: #17110c; border:none; padding: 13px 20px; font-size: 14px; font-weight: 700; cursor:pointer; font-family: inherit; }
  .btn:hover{ background:#ff8259; }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color: var(--paper); border:1px solid rgba(233,233,222,0.25); }
  .err{ color:#ff8f78; font-size: 13px; margin-top: 10px; line-height:1.5; }
  .ok{ color: var(--teal); font-size: 13px; margin-top: 10px; line-height:1.5; }
  .help{ color: var(--paper-dim); font-size: 13px; line-height:1.6; margin-top: 4px;}
  .textbtn{ background:none;border:none;color:var(--paper-dim); font-family:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:0; }

  .topbar{ display:flex; align-items:center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid var(--line); flex-wrap:wrap; gap:10px; }
  .brand{ font-family: Georgia, serif; font-size: 19px; }
  .brand b{ color: var(--signal); font-weight:400; }

  .narrow{ max-width: 560px; margin: 0 auto; padding: 22px; }
  .grouplist{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .groupcard{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--slate-2); border:1px solid var(--line); padding: 16px 18px; cursor:pointer;
  }
  .groupcard:hover{ border-color: var(--signal); }
  .groupcard .gname{ font-family: Georgia, serif; font-size:17px; }

  .dropzone{
    border: 1px dashed rgba(233,233,222,0.3); padding: 34px 20px; text-align:center;
    background: rgba(233,233,222,0.02); cursor:pointer; margin-top:14px;
  }
  .dropzone.drag{ border-color: var(--signal); background: rgba(255,106,61,0.06); }
  input[type=file]{ display:none; }
  .queue{ margin-top: 18px; display:flex; flex-direction:column; gap:8px; }
  .item{ display:flex; align-items:center; gap:10px; background: var(--slate-2); border:1px solid var(--line); padding: 8px 10px; font-size:12px; }
  .item img{ width:44px; height:44px; object-fit:cover; flex-shrink:0; background:#000; }
  .item .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .status.pending{ color: var(--paper-dim); } .status.ok{ color: var(--teal); } .status.err{ color:#ff8f78; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
  const SUPABASE_URL = "https://usxonhttmrzgaznvgksf.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzeG9uaHR0bXJ6Z2F6bnZna3NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyODU1OTksImV4cCI6MjEwMzg2MTU5OX0.utIi2q19x5TL-kF4ymrC-0cbJ2t0h0MXpeXDSA9f0wI";
  const BUCKET = "fotoguessr";

  // Esta página comparte sesión con fotoguessr.html (misma localStorage, mismo Supabase).
  // A propósito NO carga Leaflet ni ningún mapa: es la página liviana pensada
  // específicamente para que Android no la mate por memoria al abrir el selector de fotos.
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
  });

  const root = document.getElementById('root');
  let session = null, myProfile = null;

  function toDecimal(gps, ref){
    if(!gps) return null;
    let v = gps[0] + gps[1]/60 + gps[2]/3600;
    if(ref==='S'||ref==='W') v=-v;
    return v;
  }
  function mainAppUrl(){
    return new URL('fotoguessr.html', window.location.href).toString();
  }

  async function boot(){
    const { data } = await sb.auth.getSession();
    session = data.session;
    sb.auth.onAuthStateChange((event, s) => {
      session = s;
      if(event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') return;
      route();
    });
    await route();
  }

  async function route(){
    if(!session){ renderAuth(); return; }
    const { data: profile } = await sb.from('fg_profiles').select('*').eq('user_id', session.user.id).maybeSingle();
    if(!profile){
      root.innerHTML = `<div class="center-screen"><div class="card"><p class="help">Todavía no tenés nombre configurado. Entrá primero a la <a href="${mainAppUrl()}" style="color:var(--signal);">app principal</a> para configurarlo, y volvé después a cargar fotos.</p></div></div>`;
      return;
    }
    myProfile = profile;

    const params = new URLSearchParams(window.location.search);
    const groupId = params.get('group');
    if(groupId){
      const { data: group, error } = await sb.from('fg_groups').select('*').eq('id', groupId).maybeSingle();
      if(!error && group){ renderUpload(group); return; }
    }
    renderGroupPicker();
  }

  function renderAuth(){
    root.innerHTML = `
      <div class="center-screen">
        <div class="card">
          <div class="eyebrow">fotoguessr — cargar fotos</div>
          <h1 class="display">Entrá con tu mail</h1>
          <p class="help" style="margin-bottom:16px;">Te mandamos un código para entrar, sin contraseña.</p>
          <input class="field" id="emailInput" placeholder="tu@mail.com" autocomplete="email">
          <button class="btn" id="sendBtn">Enviarme el código</button>
          <div id="authMsg"></div>
        </div>
      </div>
    `;
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value.trim();
      const msgEl = document.getElementById('authMsg');
      if(!email){ msgEl.innerHTML = '<div class="err">Escribí tu mail.</div>'; return; }
      const btn = document.getElementById('sendBtn');
      btn.disabled = true; btn.textContent = 'Enviando…';
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
      btn.disabled = false; btn.textContent = 'Enviarme el código';
      if(error){ msgEl.innerHTML = `<div class="err">Error: ${error.message}</div>`; return; }
      renderVerifyCode(email);
    });
  }

  function renderVerifyCode(email){
    root.innerHTML = `
      <div class="center-screen">
        <div class="card">
          <div class="eyebrow">fotoguessr</div>
          <h1 class="display">Ingresá el código</h1>
          <p class="help" style="margin-bottom:16px;">Te lo mandamos a <b>${email}</b>. Revisá también spam.</p>
          <input class="field" id="codeInput" placeholder="código de verificación" inputmode="numeric" autocomplete="one-time-code">
          <button class="btn" id="verifyBtn">Entrar</button>
          <div id="verifyMsg"></div>
          <button class="textbtn" id="backToEmailBtn" style="margin-top:14px;">usar otro mail</button>
        </div>
      </div>
    `;
    const submit = async () => {
      const code = document.getElementById('codeInput').value.trim();
      const msgEl = document.getElementById('verifyMsg');
      if(!code){ msgEl.innerHTML = '<div class="err">Escribí el código.</div>'; return; }
      const btn = document.getElementById('verifyBtn');
      btn.disabled = true; btn.textContent = 'Verificando…';
      const { error } = await sb.auth.verifyOtp({ email, token: code, type: 'email' });
      if(error){ btn.disabled = false; btn.textContent = 'Entrar'; msgEl.innerHTML = `<div class="err">Error: ${error.message}</div>`; return; }
      const { data } = await sb.auth.getSession();
      session = data.session;
      route();
    };
    document.getElementById('verifyBtn').addEventListener('click', submit);
    document.getElementById('codeInput').addEventListener('keydown', e => { if(e.key==='Enter') submit(); });
    document.getElementById('backToEmailBtn').addEventListener('click', renderAuth);
    document.getElementById('codeInput').focus();
  }

  async function renderGroupPicker(){
    root.innerHTML = `
      <div class="topbar">
        <div class="brand display">Foto<b>G</b>uessr — cargar fotos</div>
        <a href="${mainAppUrl()}" class="textbtn">‹ volver a jugar</a>
      </div>
      <div class="narrow" id="area"><div class="help" style="text-align:center;">Cargando tus grupos…</div></div>
    `;
    const { data: memberships } = await sb.from('fg_group_members').select('group_id').eq('user_id', session.user.id);
    const area = document.getElementById('area');
    if(!memberships || memberships.length === 0){
      area.innerHTML = `<div class="help">Todavía no sos parte de ningún grupo. Andá a la <a href="${mainAppUrl()}" style="color:var(--signal);">app principal</a> para crear o unirte a uno.</div>`;
      return;
    }
    const { data: groups } = await sb.from('fg_groups').select('*').in('id', memberships.map(m=>m.group_id));
    area.innerHTML = `<p class="help">Elegí a qué grupo le querés cargar fotos:</p><div class="grouplist" id="list"></div>`;
    const list = document.getElementById('list');
    (groups||[]).forEach(g => {
      const el = document.createElement('div');
      el.className = 'groupcard';
      el.innerHTML = `<span class="gname display">${g.name}</span><span>cargar →</span>`;
      el.addEventListener('click', () => {
        const u = new URL(window.location.href);
        u.searchParams.set('group', g.id);
        window.history.replaceState({}, '', u.toString());
        renderUpload(g);
      });
      list.appendChild(el);
    });
  }

  function renderUpload(group){
    root.innerHTML = `
      <div class="topbar">
        <div class="brand display">Foto<b>G</b>uessr — ${group.name}</div>
        <div>
          <button class="textbtn" id="changeGroupBtn">cambiar grupo</button>
          &nbsp;·&nbsp;
          <a href="${mainAppUrl()}" class="textbtn">volver a jugar</a>
        </div>
      </div>
      <div class="narrow">
        <p class="help">Subí fotos con GPS activado. Se van a sortear entre las fechas del grupo, mezcladas con el resto del banco — no importa el orden en que las cargues.</p>
        <div class="dropzone" id="dropzone">
          <div>Arrastrá tus fotos acá, o hacé clic para elegirlas</div>
          <div class="help">Las que no tengan GPS en el EXIF se rechazan.</div>
          <input type="file" id="fileInput" multiple>
        </div>
        <div class="queue" id="queue"></div>
      </div>
    `;
    document.getElementById('changeGroupBtn').addEventListener('click', () => {
      const u = new URL(window.location.href);
      u.searchParams.delete('group');
      window.history.replaceState({}, '', u.toString());
      renderGroupPicker();
    });

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const queue = document.getElementById('queue');

    dropzone.addEventListener('click', () => fileInput.click());
    ['dragenter','dragover'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
    ['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
    dropzone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
    fileInput.addEventListener('change', e => { handleFiles(e.target.files); fileInput.value=''; });

    function handleFiles(list){ Array.from(list).forEach(processFile); }

    function processFile(file){
      if(!file.type.startsWith('image/')) return;
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `<img src="${URL.createObjectURL(file)}"><div class="name">${file.name}</div><div class="status pending">leyendo GPS…</div>`;
      queue.prepend(row);
      const statusEl = row.querySelector('.status');

      EXIF.getData(file, function(){
        const lat = EXIF.getTag(this,'GPSLatitude'), latRef = EXIF.getTag(this,'GPSLatitudeRef');
        const lng = EXIF.getTag(this,'GPSLongitude'), lngRef = EXIF.getTag(this,'GPSLongitudeRef');
        if(!lat || !lng || !Array.isArray(lat) || lat.length < 3 || !Array.isArray(lng) || lng.length < 3){
          statusEl.textContent='sin GPS — rechazada'; statusEl.className='status err'; return;
        }
        const decLat = toDecimal(lat, latRef);
        const decLng = toDecimal(lng, lngRef);
        if(!isFinite(decLat) || !isFinite(decLng) || decLat < -90 || decLat > 90 || decLng < -180 || decLng > 180){
          statusEl.textContent = 'GPS ilegible — rechazada'; statusEl.className = 'status err'; return;
        }
        statusEl.textContent = 'subiendo…';
        uploadFile(file, decLat, decLng, statusEl);
      });
    }

    async function uploadFile(file, lat, lng, statusEl){
      try{
        const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
        const path = `${group.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
        const { error: upErr } = await sb.storage.from(BUCKET).upload(path, file, { cacheControl:'31536000', upsert:false, contentType:file.type });
        if(upErr) throw upErr;
        const { error: dbErr } = await sb.from('fg_photos').insert({ group_id: group.id, storage_path: path, lat, lng, uploaded_by: session.user.id });
        if(dbErr) throw dbErr;
        statusEl.textContent = 'cargada ✓'; statusEl.className = 'status ok';
      }catch(e){
        statusEl.textContent = 'error: ' + (e.message||'no se pudo subir'); statusEl.className = 'status err';
      }
    }
  }

  boot();
})();
</script>
</body>
</html>
