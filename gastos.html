<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gastos</title>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/logos/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/logos/favicon-16x16.png">
  <link rel="shortcut icon" href="assets/logos/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logos/apple-touch-icon.png">
  <link rel="mask-icon" href="assets/logos/safari-pinned-tab.svg" color="#c0fe41">
  <link rel="manifest" href="assets/logos/site.webmanifest">
  <meta name="msapplication-TileColor" content="#48576F">
  <meta name="msapplication-TileImage" content="assets/logos/mstile-150x150.png">
  <meta name="theme-color" content="#48576F">

  <link rel="stylesheet" href="css/styles.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap');

    /* --- Ajustes propios de este formulario (no tocan css/styles.css) --- */

    /* Selector de categorías a 5 por fila (antes 3) */
    .category-selector {
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    /* Placeholder para categorías sin logo cargado todavía */
    .category-placeholder {
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      border: 3px solid var(--field-border);
      cursor: pointer;
      background-color: var(--field-bg);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      padding: 4px;
      line-height: 1.15;
      word-break: break-word;
    }

    .category-placeholder.selected {
      border-color: var(--accent);
    }

    /* Selector de tipo de gasto: 3 botones arriba + 1 ancho completo abajo */
    .tipo-gasto-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .tipo-gasto-selector button {
      cursor: pointer;
      background-color: var(--field-bg);
      border: 3px solid var(--field-border);
      color: var(--bg);
      font-weight: 300;
      padding: 12px 6px;
    }

    .tipo-gasto-selector button.selected {
      border-color: var(--accent);
    }

    .btn-transferencia-full {
      margin-top: 10px;
      width: 100%;
      cursor: pointer;
      background-color: var(--field-bg);
      border: 3px solid var(--field-border);
      color: var(--bg);
      font-weight: 300;
      padding: 12px 6px;
      border-radius: 20px;
      font-family: 'Poppins', sans-serif;
      font-size: clamp(16px, 4vw, 20px);
    }

    .btn-transferencia-full.selected {
      border-color: var(--accent);
    }

    /* Campos dinámicos: transición suave al aparecer/ocultarse */
    .campo-dinamico {
      overflow: hidden;
      max-height: 500px;
      opacity: 1;
      transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.25s ease;
    }

    .campo-dinamico.oculto {
      max-height: 0;
      opacity: 0;
      margin-bottom: 0 !important;
      pointer-events: none;
    }

    select {
      cursor: pointer;
    }

    .aviso-carga {
      text-align: center;
      opacity: 0.7;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>juntos</h1>
    <img class="logo" src="assets/logos/Logo.png" alt="Bomboncitos">
  </div>

  <form id="form-gasto">

    <!-- Paso 1: quién paga -->
    <div class="form-control">
      <label>quién paga?</label>
      <div class="name-selector" id="name-selector">
        <button type="button" onclick="selectRealizador(this, 'Tebi')">tebi</button>
        <button type="button" onclick="selectRealizador(this, 'Anita')">anita</button>
      </div>
    </div>

    <!-- Paso 2: tipo de gasto -->
    <div class="form-control">
      <label>tipo de gasto:</label>
      <div class="tipo-gasto-selector" id="tipo-gasto-selector">
        <button type="button" onclick="selectTipoGasto(this, 'personal')">propio</button>
        <button type="button" onclick="selectTipoGasto(this, 'compartido')">juntos</button>
        <button type="button" onclick="selectTipoGasto(this, 'ajeno')">ajeno</button>
      </div>
      <button type="button" class="btn-transferencia-full" id="btn-transferencia" onclick="selectTipoGasto(this, 'transferencia')">transferencia</button>
    </div>

    <!-- Paso 3: descripción -->
    <div class="form-control">
      <label for="descripcion">descripción:</label>
      <input type="text" id="descripcion">
    </div>

    <!-- Paso 4: medio de pago (dinámico, depende de quién paga) -->
    <div class="form-control campo-dinamico oculto" id="wrap-instrumento-pago">
      <label for="instrumento-pago">medio de pago:</label>
      <select id="instrumento-pago">
        <option value="">seleccionar...</option>
      </select>
    </div>

    <!-- Paso 5 y 6: monto y fecha -->
    <div class="row">
      <div class="form-control">
        <label for="monto">monto:</label>
        <div class="monto-wrapper">
          <button type="button" class="btn-moneda" id="btn-moneda" onclick="toggleMoneda()">ar$</button>
          <input type="number" id="monto" step="0.01" required>
        </div>
      </div>

      <div class="form-control">
        <label for="fecha">fecha:</label>
        <input type="date" id="fecha" required>
      </div>
    </div>

    <!-- Paso 7: categoría (dinámico, depende de persona + tipo de gasto) -->
    <div class="form-control campo-dinamico oculto" id="wrap-categoria">
      <label>categoría:</label>
      <div class="category-selector" id="category-selector"></div>
    </div>

    <!-- Paso 8: medio de recepción (solo transferencia) -->
    <div class="form-control campo-dinamico oculto" id="wrap-instrumento-recepcion">
      <label for="instrumento-recepcion">medio de recepción:</label>
      <select id="instrumento-recepcion">
        <option value="">seleccionar...</option>
      </select>
    </div>

    <button type="submit">enviar</button>
  </form>

  <p id="confirmacion" style="display:none; text-align:center;">¡Gasto cargado!</p>

<a class="franja"></a>

<div class="seccion-resultados">
  <div class="seccion-resultados-inner">
    <label>saldos</label>
    <div id="saldos-container"></div>

    <label>últimos registros</label>
    <div id="ultimos-registros" class="registros-caja"></div>
  </div>
</div>

<a class="franja-fin"></a>

<footer style="text-align:center; margin-top:40px; opacity:0.7; font-size:14px;">
  <p id="quien-carga"></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
  const NUM_ULTIMOS_REGISTROS = 10;

  const quienCarga = localStorage.getItem('bomboncitos_persona');
  if (!quienCarga) {
    window.location.href = 'login.html';
  } else {
    document.getElementById('quien-carga').textContent = 'cargando como: ' + quienCarga;
  }

  // --- Estado del formulario ---
  let realizador = quienCarga || 'Tebi';
  let tipoGasto = null;
  let categoriaSeleccionadaId = null;
  let moneda = 'ARS';

  // Cache de datos traídos de Supabase
  let CATEGORIAS = [];

  // ---------- Paso 1: quién paga ----------
  function selectRealizador(btn, nombre) {
    document.querySelectorAll('#name-selector button').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    realizador = nombre;
    cargarInstrumentosPago();
    // el medio de recepción depende de "el otro", así que si ya estábamos en transferencia, refrescar
    if (tipoGasto === 'transferencia') cargarInstrumentosRecepcion();
    renderCategorias();
  }

  // ---------- Paso 2: tipo de gasto ----------
  function selectTipoGasto(btn, tipo) {
    document.querySelectorAll('.tipo-gasto-selector button').forEach(b => b.classList.remove('selected'));
    document.getElementById('btn-transferencia').classList.remove('selected');
    btn.classList.add('selected');
    tipoGasto = tipo;
    categoriaSeleccionadaId = null;

    const wrapCategoria = document.getElementById('wrap-categoria');
    const wrapRecepcion = document.getElementById('wrap-instrumento-recepcion');

    if (tipo === 'transferencia') {
      wrapCategoria.classList.add('oculto');
      wrapRecepcion.classList.remove('oculto');
      cargarInstrumentosRecepcion();
    } else {
      wrapRecepcion.classList.add('oculto');
      wrapCategoria.classList.remove('oculto');
      renderCategorias();
    }
  }

  // ---------- Moneda ----------
  function toggleMoneda() {
    moneda = moneda === 'ARS' ? 'USD' : 'ARS';
    document.getElementById('btn-moneda').textContent = moneda === 'ARS' ? 'ar$' : 'u$d';
  }

  // ---------- Carga de instrumentos (medio de pago) ----------
  async function cargarInstrumentosPago() {
    const wrap = document.getElementById('wrap-instrumento-pago');
    const select = document.getElementById('instrumento-pago');
    select.innerHTML = '<option value="">seleccionar...</option>';

    const { data, error } = await supabaseClient
      .from('instrumentos')
      .select('id, nombre, es_medio_pago, activo, cuentas!inner(designacion, dueño)')
      .eq('cuentas.dueño', realizador)
      .eq('es_medio_pago', true)
      .eq('activo', true);

    if (error) {
      console.error(error);
      return;
    }

    data.forEach(inst => {
      const opt = document.createElement('option');
      opt.value = inst.id;
      opt.textContent = inst.nombre;
      select.appendChild(opt);
    });

    wrap.classList.remove('oculto');
  }

  // ---------- Carga de instrumentos (medio de recepción, del OTRO) ----------
  async function cargarInstrumentosRecepcion() {
    const select = document.getElementById('instrumento-recepcion');
    select.innerHTML = '<option value="">seleccionar...</option>';

    const otraPersona = realizador === 'Tebi' ? 'Anita' : 'Tebi';

    const { data, error } = await supabaseClient
      .from('instrumentos')
      .select('id, nombre, es_medio_recepcion, activo, cuentas!inner(designacion, dueño)')
      .eq('cuentas.dueño', otraPersona)
      .eq('es_medio_recepcion', true)
      .eq('activo', true);

    if (error) {
      console.error(error);
      return;
    }

    data.forEach(inst => {
      const opt = document.createElement('option');
      opt.value = inst.id;
      opt.textContent = inst.nombre;
      select.appendChild(opt);
    });
  }

  // ---------- Carga de categorías (una sola vez) ----------
  async function cargarCategorias() {
    const { data, error } = await supabaseClient
      .from('categorias')
      .select('*')
      .eq('activo', true);

    if (error) {
      console.error(error);
      return;
    }
    CATEGORIAS = data;
  }

  // ---------- Render dinámico de categorías según persona + tipo de gasto ----------
  function renderCategorias() {
    const cont = document.getElementById('category-selector');
    cont.innerHTML = '';
    categoriaSeleccionadaId = null;

    if (!tipoGasto || tipoGasto === 'transferencia') return;

    const otraPersona = realizador === 'Tebi' ? 'anita' : 'tebi';
    const personaKey = realizador === 'Tebi' ? 'tebi' : 'anita';

    let visibles = [];
    if (tipoGasto === 'personal') {
      visibles = CATEGORIAS.filter(c => c[personaKey]);
    } else if (tipoGasto === 'compartido') {
      visibles = CATEGORIAS.filter(c => c.compartido);
    } else if (tipoGasto === 'ajeno') {
      visibles = CATEGORIAS.filter(c => c[otraPersona]);
    }

    visibles.forEach(cat => {
      if (cat.imagen) {
        const img = document.createElement('img');
        img.src = cat.imagen;
        img.alt = cat.nombre;
        img.dataset.id = cat.id;
        img.onclick = () => selectCategoria(img, cat.id);
        cont.appendChild(img);
      } else {
        // Sin logo cargado todavía: cuadrado con el nombre como placeholder
        const div = document.createElement('div');
        div.className = 'category-placeholder';
        div.textContent = cat.nombre;
        div.dataset.id = cat.id;
        div.onclick = () => selectCategoria(div, cat.id);
        cont.appendChild(div);
      }
    });
  }

  function selectCategoria(el, id) {
    document.querySelectorAll('#category-selector img, #category-selector .category-placeholder').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
    categoriaSeleccionadaId = id;
  }

  // ---------- Formato ----------
  function formatearMonto(monto, moneda) {
    const simbolo = moneda === 'USD' ? 'u$d' : 'ar$';
    return simbolo + ' ' + new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 }).format(monto);
  }

  function formatearFecha(fechaStr) {
    const [anio, mes, dia] = fechaStr.split('-');
    return `${dia}/${mes}`;
  }

  function truncar(texto, largo) {
    if (!texto) return '';
    return texto.length > largo ? texto.slice(0, largo) + '...' : texto;
  }

  // ---------- Fórmula de saldo ----------
  function impactoEnSaldoTebi(mov) {
    const cuentaParaSaldo = mov.categorias ? mov.categorias.cuenta_para_saldo : true;
    if (mov.tipo_gasto !== 'transferencia' && cuentaParaSaldo === false) return 0;

    const signo = mov.persona === 'Tebi' ? 1 : -1;

    switch (mov.tipo_gasto) {
      case 'personal':
        return 0;
      case 'compartido':
        return signo * (parseFloat(mov.monto) / 2);
      case 'ajeno':
      case 'transferencia':
        return signo * parseFloat(mov.monto);
      default:
        return 0;
    }
  }

  // ---------- Resumen (saldos + últimos registros) ----------
  async function cargarResumen() {
    const { data, error } = await supabaseClient
      .from('movimientos')
      .select('*, categorias(nombre, cuenta_para_saldo)')
      .not('tipo_gasto', 'is', null);

    if (error) {
      console.error(error);
      return;
    }

    const totalesPorMoneda = {};
    data.forEach(m => {
      if (!totalesPorMoneda[m.moneda]) totalesPorMoneda[m.moneda] = 0;
      totalesPorMoneda[m.moneda] += impactoEnSaldoTebi(m);
    });

    const contenedorSaldos = document.getElementById('saldos-container');
    contenedorSaldos.innerHTML = '';

    Object.keys(totalesPorMoneda).forEach(mon => {
      const dif = totalesPorMoneda[mon];
      if (Math.abs(dif) < 0.01) return;

      const tebiEsDeudor = dif < 0;

      const fila = document.createElement('div');
      fila.className = 'saldos-row';
      fila.innerHTML = `
        <div class="saldo-persona ${tebiEsDeudor ? 'deudor' : 'acreedor'}">tebi</div>
        <div class="saldo-monto">${formatearMonto(Math.abs(dif), mon)}</div>
        <div class="saldo-persona ${tebiEsDeudor ? 'acreedor' : 'deudor'}">anita</div>
      `;
      contenedorSaldos.appendChild(fila);
    });

    const { data: ultimos, error: errorUltimos } = await supabaseClient
      .from('movimientos')
      .select('*, categorias(nombre)')
      .not('tipo_gasto', 'is', null)
      .order('creado_en', { ascending: false })
      .limit(NUM_ULTIMOS_REGISTROS);

    if (errorUltimos) {
      console.error(errorUltimos);
      return;
    }

    const contenedorRegistros = document.getElementById('ultimos-registros');
    contenedorRegistros.innerHTML = '';

    ultimos.forEach(m => {
      const linea = document.createElement('div');
      linea.className = 'registro-linea';
      if (m.tipo_gasto === 'transferencia') {
        linea.textContent = `${formatearFecha(m.fecha)} ${formatearMonto(m.monto, m.moneda)} ${m.persona.toLowerCase()} → transferencia ${truncar(m.descripcion, 20)}`;
      } else {
        const cat = m.categorias ? m.categorias.nombre : '';
        linea.textContent = `${formatearFecha(m.fecha)} ${formatearMonto(m.monto, m.moneda)} ${m.persona.toLowerCase()} ${cat} ${truncar(m.descripcion, 18)}`;
      }
      contenedorRegistros.appendChild(linea);
    });
  }

  // ---------- Envío del formulario ----------
  document.getElementById('form-gasto').addEventListener('submit', async function (e) {
    e.preventDefault();

    if (!tipoGasto) {
      alert('Elegí el tipo de gasto.');
      return;
    }

    const instrumentoPago = document.getElementById('instrumento-pago').value;
    if (!instrumentoPago) {
      alert('Elegí el medio de pago.');
      return;
    }

    if (tipoGasto === 'transferencia') {
      const instrumentoRecepcion = document.getElementById('instrumento-recepcion').value;
      if (!instrumentoRecepcion) {
        alert('Elegí el medio de recepción.');
        return;
      }
    } else {
      if (!categoriaSeleccionadaId) {
        alert('Elegí la categoría.');
        return;
      }
    }

    const monto = document.getElementById('monto').value;
    const descripcion = document.getElementById('descripcion').value;
    const fecha = document.getElementById('fecha').value;

    const payload = {
      tipo_gasto: tipoGasto,
      persona: realizador,
      instrumento_pago_id: parseInt(instrumentoPago),
      instrumento_recepcion_id: tipoGasto === 'transferencia'
        ? parseInt(document.getElementById('instrumento-recepcion').value)
        : null,
      categoria_id: tipoGasto === 'transferencia' ? null : categoriaSeleccionadaId,
      monto: parseFloat(monto),
      descripcion: descripcion,
      fecha: fecha,
      moneda: moneda,
      cargado_por: quienCarga
    };

    const { error } = await supabaseClient.from('movimientos').insert(payload);

    if (error) {
      alert('Error al guardar: ' + error.message);
      return;
    }

    // Reset del formulario
    document.getElementById('form-gasto').reset();
    document.querySelectorAll('.name-selector button, .tipo-gasto-selector button').forEach(i => i.classList.remove('selected'));
    document.getElementById('btn-transferencia').classList.remove('selected');
    document.getElementById('wrap-instrumento-pago').classList.add('oculto');
    document.getElementById('wrap-instrumento-recepcion').classList.add('oculto');
    document.getElementById('wrap-categoria').classList.add('oculto');
    document.getElementById('category-selector').innerHTML = '';
    tipoGasto = null;
    categoriaSeleccionadaId = null;
    moneda = 'ARS';
    document.getElementById('btn-moneda').textContent = 'ar$';
    realizador = quienCarga;

    document.getElementById('confirmacion').style.display = 'block';
    setTimeout(() => document.getElementById('confirmacion').style.display = 'none', 2000);

    cargarResumen();
  });

  // ---------- Inicialización ----------
  (async function init() {
    await cargarCategorias();
    await cargarResumen();
  })();
</script>

</body>
</html>
