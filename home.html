<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bomboncitos</title>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/logos/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/logos/favicon-16x16.png">
  <link rel="shortcut icon" href="assets/logos/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logos/apple-touch-icon.png">
  <link rel="mask-icon" href="assets/logos/safari-pinned-tab.svg" color="#c0fe41">
  <link rel="manifest" href="assets/logos/site.webmanifest">
  <meta name="msapplication-TileColor" content="#48576F">
  <meta name="msapplication-TileImage" content="assets/logos/mstile-150x150.png">
  <meta name="theme-color" content="#48576F">

  <link rel="stylesheet" href="css/styles.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap');

    .home-links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 24px;
    }

    .home-links button {
      cursor: pointer;
      text-align: left;
      font-weight: 500;
      border-color: var(--field-border);
      color: var(--bg);
    }

    .home-links button:active {
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <img class="logo-login" src="assets/logos/Logo.png" alt="Bomboncitos">
  <h1>bomboncitos</h1>

  <div class="home-links">
    <button type="button" onclick="location.href='gastos.html'">gastos</button>
    <button type="button" onclick="location.href='ingresos.html'">ingresos</button>
    <button type="button" onclick="location.href='movimientos.html'">movimientos</button>
  </div>

  <p id="quien-carga" style="text-align:center; opacity:0.7; font-size:14px; margin-top:30px;"></p>

  <script>
    const persona = localStorage.getItem('bomboncitos_persona');
    if (!persona) {
      window.location.href = 'login.html';
    } else {
      document.getElementById('quien-carga').textContent = 'cargando como: ' + persona;
    }
  </script>
</body>
</html>
